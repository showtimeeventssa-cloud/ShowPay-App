<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>ShowPay — Artist Desk</title>
</head>
<body>
<div class="app-shell">
<header class="topbar"><button class="brand-btn" data-go="home"><img src="assets/showpay-logo-art.jpg" alt="ShowPay"></button><div class="top-actions"><button class="icon-btn" data-action="quickInvoice">＋</button></div></header>
<div class="layout">
<aside class="sidebar"><nav>
<button data-go="home">⌂ <span>Artist Desk</span></button><button data-go="shows">🎵 <span>Shows</span></button><button data-go="calendar">📅 <span>Calendar</span></button><button data-go="clients">👥 <span>Clients</span></button><button data-go="quotes">📝 <span>Quotes</span></button><button data-go="invoices">🧾 <span>Invoices</span></button><button data-go="income">💰 <span>Income</span></button><button data-go="reports">📊 <span>Reports</span></button><button data-go="marketing">📱 <span>Marketing</span></button><button data-go="contracts">📄 <span>Contracts</span></button><button data-go="settings">⚙️ <span>Settings</span></button>
</nav><div class="sync-card"><b>Shared Desk</b><small>Export or import your ShowPay data to keep you and your fiancé in sync.</small><button class="gold-btn" data-action="exportData">Export</button><button class="ghost-btn" data-action="importData">Import</button><input id="importFile" type="file" accept="application/json" hidden></div></aside>
<main id="main"></main>
</div>
<div id="modal" class="modal" hidden><div class="modal-card"><button class="modal-x" data-action="closeModal">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body></html>
